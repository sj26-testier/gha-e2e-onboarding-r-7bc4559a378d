name: PR610 Windows-only zstd cache proof
on:
  push:
    branches: [lab/r-93ce39e42b3f]
permissions:
  contents: read
jobs:
  windows:
    name: Windows saves and exact-restores A and B
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Record managed Node24 executable
        id: node24
        uses: ./.lab/actions/node24
      - name: Verify fresh workspace and exact inputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git rev-parse HEAD
          if (Test-Path -LiteralPath cache-data) { throw 'Cache directory was not initially absent' }
          $root = [IO.Path]::GetPathRoot([Environment]::SystemDirectory)
          $stock = Join-Path $root 'tools/zstd/zstd.exe'
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $stock).Hash.ToLowerInvariant() -ne '8076aae03feac7c66b319579e82172eed168deed2a3f25e5e2d3c60f55e84111') { throw 'Unapproved stock zstd bytes' }
          Get-FileHash -Algorithm SHA256 -LiteralPath $stock | Format-List
          & $stock '--version'
          if ($LASTEXITCODE -ne 0) { throw 'Stock zstd version failed' }
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath .lab/bin/cache-final.test.exe).Hash.ToLowerInvariant() -ne '3f2d8402dbba2a21c073cf00fca824a85148bed5df70731b2753ca9f0a4c608b') { throw 'Supplied test digest mismatch' }
      - name: Prepare independently hashed A
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path cache-data -Force | Out-Null
          $bytes = [Convert]::FromBase64String((Get-Content -LiteralPath .lab/payloads/A.b64 -Raw).Trim())
          [IO.File]::WriteAllBytes((Join-Path $PWD 'cache-data/payload.bin'), $bytes)
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath cache-data/payload.bin).Hash.ToLowerInvariant()
          if ($hash -ne '9b1f9ae8e66bfdd719cdebe9cb48505681dbdb2f8f3764aa1cedebbfc1ef6ec1') { throw 'Prepared A bytes differ' }
          Write-Output "LAB_PREPARED_A: sha256=$hash"
      - name: Save exact A
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: cache-data
          key: lab-pr610-r-93ce39e42b3f-windows-A
          enableCrossOsArchive: true
      - name: Delete A before restore
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item -LiteralPath cache-data -Recurse -Force
          if (Test-Path -LiteralPath cache-data) { throw 'Cache directory survived deletion' }
          Write-Output 'LAB_DELETED_A: cache-data absent'
      - name: Restore exact A
        id: restore_a
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: cache-data
          key: lab-pr610-r-93ce39e42b3f-windows-A
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: Verify restored A independently
        shell: pwsh
        env:
          CACHE_HIT: ${{ steps.restore_a.outputs.cache-hit }}
          CACHE_MATCHED_KEY: ${{ steps.restore_a.outputs.cache-matched-key }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:CACHE_HIT -ne 'true' -or $env:CACHE_MATCHED_KEY -ne 'lab-pr610-r-93ce39e42b3f-windows-A') { throw 'Expected exact key A, not a prefix hit or miss' }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath cache-data/payload.bin).Hash.ToLowerInvariant()
          if ($hash -ne '9b1f9ae8e66bfdd719cdebe9cb48505681dbdb2f8f3764aa1cedebbfc1ef6ec1') { throw 'Restored A bytes differ' }
          Write-Output "LAB_CACHE_A_VERIFIED: sha256=$hash key=$env:CACHE_MATCHED_KEY"
      - name: Prepare independently hashed B
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path cache-data -Force | Out-Null
          $bytes = [Convert]::FromBase64String((Get-Content -LiteralPath .lab/payloads/B.b64 -Raw).Trim())
          [IO.File]::WriteAllBytes((Join-Path $PWD 'cache-data/payload.bin'), $bytes)
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath cache-data/payload.bin).Hash.ToLowerInvariant()
          if ($hash -ne '9e3935cbe17adf7a71497ca1ed71f39ba8afd23793698db21f433f8e5b153400') { throw 'Prepared B bytes differ' }
          Write-Output "LAB_PREPARED_B: sha256=$hash"
      - name: Save exact B
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: cache-data
          key: lab-pr610-r-93ce39e42b3f-windows-B
          enableCrossOsArchive: true
      - name: Delete B before restore
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item -LiteralPath cache-data -Recurse -Force
          if (Test-Path -LiteralPath cache-data) { throw 'Cache directory survived deletion' }
          Write-Output 'LAB_DELETED_B: cache-data absent'
      - name: Restore exact B
        id: restore_b
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: cache-data
          key: lab-pr610-r-93ce39e42b3f-windows-B
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: Verify restored B independently
        shell: pwsh
        env:
          CACHE_HIT: ${{ steps.restore_b.outputs.cache-hit }}
          CACHE_MATCHED_KEY: ${{ steps.restore_b.outputs.cache-matched-key }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:CACHE_HIT -ne 'true' -or $env:CACHE_MATCHED_KEY -ne 'lab-pr610-r-93ce39e42b3f-windows-B') { throw 'Expected exact key B, not a prefix hit or miss' }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath cache-data/payload.bin).Hash.ToLowerInvariant()
          if ($hash -ne '9e3935cbe17adf7a71497ca1ed71f39ba8afd23793698db21f433f8e5b153400') { throw 'Restored B bytes differ' }
          Write-Output "LAB_CACHE_B_VERIFIED: sha256=$hash key=$env:CACHE_MATCHED_KEY"
      - name: Execute all selected Windows archive and isolation regressions
        shell: pwsh
        env:
          BUILDKITE_GHA_TEST_NODE24: ${{ steps.node24.outputs.executable }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not [IO.Path]::IsPathFullyQualified($env:BUILDKITE_GHA_TEST_NODE24)) { throw 'Node24 path is not absolute' }
          & $env:BUILDKITE_GHA_TEST_NODE24 './.lab/run-windows-tests.cjs'
          if ($LASTEXITCODE -ne 0) { throw 'Windows regression wrapper failed' }
