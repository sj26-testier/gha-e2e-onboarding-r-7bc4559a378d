name: PR610 cross-OS zstd cache proof
on:
  push:
    branches: [lab/r-7bc4559a378d]
permissions:
  contents: read
jobs:
  producer:
    name: Linux saves A
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Create independently hashed A
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          command -v tar; tar --version
          command -v zstd; zstd --version
          test ! -e cache-data
          mkdir cache-data
          base64 --decode .lab/payloads/A.b64 > cache-data/payload.bin
          printf '%s  cache-data/payload.bin\n' '9b1f9ae8e66bfdd719cdebe9cb48505681dbdb2f8f3764aa1cedebbfc1ef6ec1' | sha256sum -c -
      - name: Save exact A
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: cache-data
          key: lab-pr610-r-7bc4559a378d-cross-os-A
          enableCrossOsArchive: true
  bridge:
    name: Windows restores A and saves B
    needs: producer
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Record managed Node24 executable
        id: node24
        uses: ./.lab/actions/node24
      - name: Verify fresh Windows workspace and exact test input
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git rev-parse HEAD
          if (Test-Path -LiteralPath cache-data) { throw 'Cache directory was not initially absent' }
          $root = [IO.Path]::GetPathRoot([Environment]::SystemDirectory)
          $stock = Join-Path $root 'tools/zstd/zstd.exe'
          if (-not (Test-Path -LiteralPath $stock -PathType Leaf)) { throw 'Stock zstd candidate absent; no installation permitted' }
          Get-FileHash -Algorithm SHA256 -LiteralPath $stock | Format-List
          & $stock --version
          if ($LASTEXITCODE -ne 0) { throw 'Stock zstd version command failed' }
          $test = (Resolve-Path .lab/bin/cache-final.test.exe).Path
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $test).Hash.ToLowerInvariant() -ne '3f2d8402dbba2a21c073cf00fca824a85148bed5df70731b2753ca9f0a4c608b') { throw 'Windows test executable digest mismatch' }
      - name: Execute Windows archive and isolation regressions
        shell: pwsh
        env:
          BUILDKITE_GHA_TEST_NODE24: ${{ steps.node24.outputs.executable }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not [IO.Path]::IsPathFullyQualified($env:BUILDKITE_GHA_TEST_NODE24)) { throw 'Node24 path is not absolute' }
          $version = & $env:BUILDKITE_GHA_TEST_NODE24 --version
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^v24\.') { throw 'Managed Node24 unavailable' }
          & ./.lab/bin/cache-final.test.exe -test.run '^(TestCacheServiceLifecycleUsesFreshIsolatedCredentials|TestWindowsCache.*|TestIsolateCacheActionEnvironment.*)$' -test.v
          if ($LASTEXITCODE -ne 0) { throw 'Windows regression executable failed' }
          Write-Output 'LAB_WINDOWS_TESTS_PASSED'
      - name: Restore exact A
        id: restore_a
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: cache-data
          key: lab-pr610-r-7bc4559a378d-cross-os-A
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: Verify A independently and prepare distinct B
        shell: pwsh
        env:
          CACHE_HIT: ${{ steps.restore_a.outputs.cache-hit }}
          CACHE_MATCHED_KEY: ${{ steps.restore_a.outputs.cache-matched-key }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:CACHE_HIT -ne 'true' -or $env:CACHE_MATCHED_KEY -ne 'lab-pr610-r-7bc4559a378d-cross-os-A') { throw 'Expected exact key A, not a prefix hit or miss' }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath cache-data/payload.bin).Hash.ToLowerInvariant()
          if ($hash -ne '9b1f9ae8e66bfdd719cdebe9cb48505681dbdb2f8f3764aa1cedebbfc1ef6ec1') { throw 'Restored A bytes differ' }
          Write-Output "LAB_CACHE_A_VERIFIED: sha256=$hash key=$env:CACHE_MATCHED_KEY"
          $bytes = [Convert]::FromBase64String((Get-Content -LiteralPath .lab/payloads/B.b64 -Raw).Trim())
          [IO.File]::WriteAllBytes((Join-Path $PWD 'cache-data/payload.bin'), $bytes)
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath cache-data/payload.bin).Hash.ToLowerInvariant()
          if ($hash -ne '9e3935cbe17adf7a71497ca1ed71f39ba8afd23793698db21f433f8e5b153400') { throw 'Prepared B bytes differ' }
      - name: Save exact B
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: cache-data
          key: lab-pr610-r-7bc4559a378d-cross-os-B
          enableCrossOsArchive: true
  consumer:
    name: Linux restores B
    needs: bridge
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Require clean Linux destination
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          test ! -e cache-data
          command -v zstd; zstd --version
      - name: Restore exact B
        id: restore_b
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: cache-data
          key: lab-pr610-r-7bc4559a378d-cross-os-B
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: Verify exact B independently
        shell: bash
        env:
          CACHE_HIT: ${{ steps.restore_b.outputs.cache-hit }}
          CACHE_MATCHED_KEY: ${{ steps.restore_b.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          test "$CACHE_HIT" = true
          test "$CACHE_MATCHED_KEY" = 'lab-pr610-r-7bc4559a378d-cross-os-B'
          printf '%s  cache-data/payload.bin\n' '9e3935cbe17adf7a71497ca1ed71f39ba8afd23793698db21f433f8e5b153400' | sha256sum -c -
          echo 'LAB_CACHE_B_VERIFIED: sha256=9e3935cbe17adf7a71497ca1ed71f39ba8afd23793698db21f433f8e5b153400 key=lab-pr610-r-7bc4559a378d-cross-os-B'
